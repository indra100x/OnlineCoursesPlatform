services:
  app-1: &app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courseatlas-app-1
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
    volumes:
      - storage_data:/var/www/html/storage
      - public_data:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -tt"]
      interval: 10s
      timeout: 5s
      retries: 3

  app-2:
    <<: *app
    container_name: courseatlas-app-2

  nginx:
    image: nginx:alpine
    container_name: courseatlas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - public_data:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro
      - ./docker/nginx/loadbalancer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-1
      - app-2

  queue:
    <<: *app
    container_name: courseatlas-queue
    command: sh -c "php artisan config:clear && php artisan queue:work redis --tries=3 --timeout=90 --max-time=3600"

  scheduler:
    <<: *app
    container_name: courseatlas-scheduler
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

  db:
    image: postgres:16-alpine
    container_name: courseatlas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-courseatlas}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: courseatlas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  storage_data:
  public_data:
  pg_data:
  redis_data:
